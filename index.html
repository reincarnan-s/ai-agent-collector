<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Agent 技术文章收集器 - 学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .controls {
            padding: 25px 30px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-container {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-container select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .search-container select:focus {
            outline: none;
            border-color: #667eea;
        }

        .sort-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sort-btn {
            padding: 10px 18px;
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sort-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sort-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .articles-list {
            display: grid;
            gap: 20px;
        }

        .article-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .article-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            border-color: #667eea;
        }

        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            flex: 1;
            line-height: 1.4;
        }

        .article-title:hover {
            color: #667eea;
        }

        .heat-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .heat-hot {
            background: #ff6b6b;
            color: white;
        }

        .heat-warm {
            background: #ffa94d;
            color: white;
        }

        .heat-normal {
            background: #74b9ff;
            color: white;
        }

        .heat-cold {
            background: #a8d8ff;
            color: white;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .article-category {
            display: inline-block;
            background: #e7f5ff;
            color: #0066cc;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .article-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .article-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .article-link:hover {
            text-decoration: underline;
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .favorite-btn:hover {
            transform: scale(1.2);
        }

        .favorite-btn.favorited {
            animation: heartBeat 0.3s ease;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            color: #999;
            float: right;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #333;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            clear: both;
        }

        .modal-list {
            display: grid;
            gap: 15px;
        }

        .no-favorites {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-container {
                flex-direction: column;
            }

            .sort-buttons {
                justify-content: center;
            }

            .article-header {
                flex-direction: column;
                align-items: start;
            }

            .heat-badge {
                align-self: flex-start;
            }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Agent 技术文章收集器</h1>
            <p>一键收集 GitHub 最新的 AI 相关文章，帮助你学习 AI 技术</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalArticles">0</div>
                <div class="stat-label">📚 收集的文章</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="favoriteCount">0</div>
                <div class="stat-label">❤️ 我的收藏</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="hotCount">0</div>
                <div class="stat-label">🔥 热门文章</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgHeat">0</div>
                <div class="stat-label">📊 平均热度</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="collectBtn">
                <span>📥</span>
                <span>收集最新文章</span>
            </button>
            <button class="btn btn-secondary" id="favoritesBtn">
                <span>❤️</span>
                <span>我的收藏</span>
            </button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 搜索文章..." />
                <select id="categoryFilter">
                    <option value="">📁 所有分类</option>
                    <option value="Agent 框架">Agent 框架</option>
                    <option value="大语言模型">大语言模型</option>
                    <option value="提示工程">提示工程</option>
                    <option value="检索增强生成">检索增强生成</option>
                    <option value="工具使用">工具使用</option>
                </select>
            </div>
        </div>

        <div class="controls" style="padding: 15px 30px;">
            <div style="width: 100%; margin-bottom: 10px; color: #666; font-size: 0.9em;">📊 排序方式：</div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="heat">🔥 热度</button>
                <button class="sort-btn" data-sort="date">📅 最新</button>
                <button class="sort-btn" data-sort="stars">⭐ Stars</button>
                <button class="sort-btn" data-sort="engagement">🎯 参与度</button>
            </div>
        </div>

        <div class="content">
            <div id="articlesContainer" class="articles-list">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <p>还没有收集任何文章</p>
                    <p style="font-size: 0.9em; color: #999;">点击上方 "收集最新文章" 按钮开始收集</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 收藏夹 Modal -->
    <div id="favoritesModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div class="modal-title">❤️ 我的收藏</div>
            <div id="favoritesList" class="modal-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
